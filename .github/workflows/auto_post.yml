name: Threads Auto Post

on:
  schedule:
    - cron: "0 22 * * *"  # 7:00 JST
    - cron: "0 3 * * *"   # 12:00 JST
    - cron: "0 12 * * *"  # 21:00 JST
  workflow_dispatch:
    inputs:
      time_slot:
        description: "時間帯 (07/12/21)"
        required: true
        default: "07"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests pytz

      - name: 時間帯を決定
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ github.event.inputs.time_slot }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(TZ="Asia/Tokyo" date +%H)
            if [ "$HOUR" = "07" ]; then
              echo "slot=07" >> $GITHUB_OUTPUT
            elif [ "$HOUR" = "12" ]; then
              echo "slot=12" >> $GITHUB_OUTPUT
            else
              echo "slot=21" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Threadsに投稿
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TIME_SLOT: ${{ steps.slot.outputs.slot }}
        run: python threads_post.py
